name: Faraja NHIF PHP Lint

on:
  push:
    branches:
      - faraja-complete-nhif-project
    paths:
      - 'FARAJASYS-NHIF-COMPLETE/**/*.php'
      - '.github/workflows/faraja-nhif-php-lint.yml'
  workflow_dispatch:

jobs:
  lint:
    strategy:
      matrix:
        php: ['8.1', '8.5']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax check
        shell: bash
        run: |
          set -e
          find FARAJASYS-NHIF-COMPLETE -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l
