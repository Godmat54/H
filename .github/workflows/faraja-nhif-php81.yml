name: Faraja NHIF PHP 8.1.25 Check

on:
  push:
    branches:
      - faraja-nhif-complete-download
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1.25'
      - name: Confirm PHP version
        run: php -v
      - name: Lint PHP files
        shell: bash
        run: |
          set -e
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l